name: siteknisi_apps
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  image_picker: ^1.2.1
  shared_preferences: ^2.5.4
  url_launcher: ^6.3.2

dev_dependencies:
